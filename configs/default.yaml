# Default run configuration, sized for an RTX 4050 Laptop GPU (6 GB VRAM)
# running Trackmania on the same GPU. Any key can be overridden with
# `tmai <command> --config my.yaml` or `--set section.key=value`.

run:
  name: default
  output_dir: runs            # checkpoints, replay snapshots, reports, logs
  seed: 0
  track: tmrl-test            # name used for runs/tracks/<track>/ (demos, reference line)

env:
  step_hz: 20                 # control frequency (TMRL uses 20 Hz too)
  # What the policy sees. image: camera frames for the CNN plus the state vector
  # (Windows only, it needs window capture). state: no camera; the policy drives
  # from the Openplanet plugin's game state and the reference line alone, which
  # works on Linux too. A run keeps the mode it started with.
  observation: image
  frame_size: 64              # square grayscale frames fed to the CNN
  frame_stack: 4
  lookahead_points: 10        # reference-line points ahead of the car, in car frame
  lookahead_spacing_m: 10.0
  lookahead_growth: 1.0       # each gap is this times the one before (state mode suggests 1.1)
  # State mode only (ignored in image mode): virtual lidar (distance to the
  # wall or road edge and the road's height ahead, in 15 directions, cast
  # against the map's collision geometry). On by default in state mode; needs
  # the TMAI Map Geometry plugin and a passing `tmai geometry-check` for the
  # map. A run keeps the setting it started with.
  lidar: true
  # Hold full gas during the 3-2-1 countdown after a restart so the car leaves
  # the line at GO like a human without losing a step to reaction time.
  launch_hold_gas: true
  # Gas and brake are two separate policy outputs. Trackmania 2020 reads both
  # pedals as on/off (only steering is analog), so with this on each output is
  # a button: above 0 presses the pedal fully, otherwise it is released.
  # false sends the half-pressed trigger and lets the game decide.
  digital_pedals: true
  episode_timeout_s: 120      # hard cap per attempt; lap length should fit inside
  stuck_timeout_s: 3.0        # reset if speed stays below stuck_speed_kmh this long
  stuck_speed_kmh: 10.0
  telemetry_port: 9000        # Openplanet plugin -> Python (localhost only)
  # Each step acts on a packet received at most this long ago (the plugin sends
  # one per frame). With none that fresh, the controls are released and the
  # step waits, instead of acting on what the game looked like before.
  max_telemetry_age_s: 0.1
  # Gamepad button that restarts the run. B is the game's default respawn,
  # which restarts maps without checkpoints (like tmrl-test). For maps with
  # checkpoints (like Test1), bind "Give up" to View/Back in the game's
  # Settings > Controls and pass --set env.restart_button=BACK.
  restart_button: B
  # After a personal best the game shows its end-of-race menu, which ignores
  # the restart button. This button picks the menu's default choice, Improve.
  menu_button: A
  # window: capture the game window directly (works behind other windows).
  # screen: capture the screen area (game must be visible and on top).
  capture_backend: window

track:
  reference_spacing_m: 1.0    # resolution of the reference line
  max_progress_jump_m: 30.0   # bigger jumps in one step are respawns/cuts: no credit
  wrong_way_m: 25.0           # end the attempt after falling this far behind the best progress
  off_track_m: 0.0            # end when this far from the line (0 = off; tracks vary)
  crash_speed_drop_kmh: 40.0  # speed lost in one step that counts as a crash
  # When the agent beats the reference lap by this much, its lap becomes the new
  # reference line (your demo line is kept as reference_demo.npz). 0 = never.
  adopt_best_gain_ms: 50

reward:
  progress_per_m: 0.1         # main signal: metres gained along the reference line
  time_penalty: 0.01          # per step, so faster is always better
  pace_per_s: 30.0            # per second gained (or lost) on the pace baseline, point by point
  # The pace baseline is the pace_baseline_percentile-th percentile (default 25:
  # faster than the median, 50 = median) of the agent's last pace_baseline_laps
  # finished laps, measured point by point (a lap with a crash does not move it),
  # so beating its own faster recent driving pays even when the lap is not a best.
  # Replay scores the pace term again against the current baseline each batch, so
  # old laps are judged by today's standard. Until pace_baseline_min_laps laps are
  # in, and with 0 laps, it is the reference lap.
  pace_baseline_laps: 30
  pace_baseline_min_laps: 5
  pace_baseline_percentile: 25
  # The pace loss of a step may take at most this share of the step's progress
  # reward, and nothing when the car did not move forward. Without it a slow car
  # lost more the further it drove (-1.5 a step at a standstill with pace_per_s
  # 30), so ending the attempt looked better than driving on. 0.5 keeps every
  # metre worth at least half its progress reward; faster always pays more.
  pace_loss_cap: 0.5
  pb_bonus_per_s: 20.0        # at the finish, per second faster than the best lap so far
  pb_bonus_cap: 5.0
  crash_penalty: 1.0
  split_bonus_per_s: 1.0      # per second faster than the best split at a checkpoint
  split_bonus_cap: 2.0
  finish_bonus: 10.0

model:
  algorithm: sac_droq         # SAC actor + dropout/LayerNorm Q ensemble (DroQ)
  encoder_channels: [32, 64, 64, 64]
  hidden_dim: 256
  num_critics: 2
  critic_dropout: 0.01
  actor_layer_norm: true      # LayerNorm in actor MLP to keep activations stable
  # Distributional HL-Gauss critic head (categorical histogram over [q_min, q_max])
  # instead of a scalar MSE head; stabilizes high-UTD value learning.
  # Support covers [-150, 200] (2.5-unit bins across 141 atoms) so stuck, slow
  # and early-exploration returns at pace_per_s=30 stay in-range without biasing
  # initial Q overly positive.
  critic_head: hl_gauss
  q_bins: 141                 # number of support bins for the HL-Gauss critic
  q_min: -150.0               # lower bound of the HL-Gauss Q support
  q_max: 200.0                # upper bound of the HL-Gauss Q support
  hl_sigma_ratio: 0.75        # Gaussian smoothing width relative to bin width
  # bf16 autocast uses the 4050's tensor cores; fp32 master weights are kept.
  precision: bf16

train:
  batch_size: 256
  learning_rate: 3.0e-4
  optimizer: adamw            # adamw (decoupled weight decay) or adam
  weight_decay: 1.0e-4        # weight decay for AdamW to limit plasticity loss
  # 0.995 at 20 Hz weighs about the next 10 s of driving (0.99 was 5 s), so the
  # critic sees how a corner exit pays off down the following straight.
  gamma: 0.995
  n_step: 5                   # rewards summed over this many steps before bootstrapping
  tau: 0.005
  updates_per_step: 8         # update-to-data ratio: learner updates per driving step
  critic_loss: huber          # huber or mse (for scalar critic heads)
  huber_delta: 1.0            # transition threshold for Huber critic loss
  reset_every_updates: 400000 # shrink-and-perturb interval (0 = off) to fight plasticity loss
  reset_shrink: 0.8           # weight retention factor at each shrink-and-perturb step
  warmup_steps: 1000          # steps of the untrained (near-random) policy before learning starts
  # Share of each batch drawn from guide laps: your demo laps plus the agent's own
  # fastest laps. Starts at demo_ratio (RLPD) and falls linearly to demo_ratio_end
  # over demo_anneal_steps driving steps, so slower demos stop anchoring the policy.
  # Setting it from the dashboard turns the schedule off for the rest of the run.
  demo_ratio: 0.5
  demo_ratio_end: 0.1
  demo_anneal_steps: 200000   # ~3 h of driving at 20 Hz
  best_laps_kept: 3           # agent's fastest finished laps kept as guide laps (0 = demos only)
  # SAC entropy target: how much randomness the policy keeps (-action_dim = -3.0).
  # Held flat at -3.0 instead of annealing down to -6.0 so exploration does not
  # collapse prematurely on tight lines; test laps (eval_every) still drive
  # deterministically. Setting it from the dashboard turns the schedule off.
  target_entropy: -3.0
  target_entropy_end: -3.0
  entropy_anneal_steps: 500000
  # Every Nth attempt is a test lap without exploration noise; the best test lap's
  # driving weights are kept in checkpoints/best_test_lap.pt. 0 = no test laps.
  eval_every: 10
  checkpoint_every_min: 10

replay:
  # Stored in system RAM, not VRAM. ~4.2 KB per transition at 64x64 frames,
  # so 500k transitions is ~2.1 GB. `tmai doctor` suggests a size for your RAM.
  capacity: 500000
  snapshot_every_min: 30

gpu:
  # Training stops if CUDA is not available instead of quietly running on the
  # CPU (far too slow for the real-time loop). true = allow the CPU anyway.
  allow_cpu: false
  # Hard cap on the share of VRAM PyTorch may allocate, leaving room for the game.
  max_vram_fraction: 0.5
  # Planned thermal governor, not used yet. NVML temperature thresholds (deg C):
  # above soft, halve updates_per_step; above hard, pause learning until it cools.
  temp_soft_c: 80
  temp_hard_c: 87

dashboard:
  host: 127.0.0.1             # never expose to the network
  port: 8080                  # web page: http://127.0.0.1:8080
  link_port: 8081             # trainer <-> dashboard messages (localhost UDP)
  tensorboard: true
