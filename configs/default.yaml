# Default run configuration, sized for an RTX 4050 Laptop GPU (6 GB VRAM)
# running Trackmania on the same GPU. Any key can be overridden with
# `tmai <command> --config my.yaml` or `--set section.key=value`.

run:
  name: default
  output_dir: runs            # checkpoints, replay snapshots, reports, logs
  seed: 0
  track: tmrl-test            # name used for runs/tracks/<track>/ (demos, reference line)

env:
  step_hz: 20                 # control frequency (TMRL uses 20 Hz too)
  frame_size: 64              # square grayscale frames fed to the CNN
  frame_stack: 4
  lookahead_points: 10        # reference-line points ahead of the car, in car frame
  lookahead_spacing_m: 10.0
  episode_timeout_s: 120      # hard cap per attempt; lap length should fit inside
  stuck_timeout_s: 3.0        # reset if speed stays below stuck_speed_kmh this long
  stuck_speed_kmh: 10.0
  telemetry_port: 9000        # Openplanet plugin -> Python (localhost only)
  # Gamepad button that restarts the run. B is the game's default respawn,
  # which restarts maps without checkpoints (like tmrl-test). For maps with
  # checkpoints (like Test1), bind "Give up" to View/Back in the game's
  # Settings > Controls and pass --set env.restart_button=BACK.
  restart_button: B
  # After a personal best the game shows its end-of-race menu, which ignores
  # the restart button. This button picks the menu's default choice, Improve.
  menu_button: A
  # window: capture the game window directly (works behind other windows).
  # screen: capture the screen area (game must be visible and on top).
  capture_backend: window

track:
  reference_spacing_m: 1.0    # resolution of the reference line
  max_progress_jump_m: 30.0   # bigger jumps in one step are respawns/cuts: no credit
  wrong_way_m: 25.0           # end the attempt after falling this far behind the best progress
  off_track_m: 0.0            # end when this far from the line (0 = off; tracks vary)
  crash_speed_drop_kmh: 40.0  # speed lost in one step that counts as a crash
  # When the agent beats the reference lap by this much, its lap becomes the new
  # reference line (your demo line is kept as reference_demo.npz). 0 = never.
  adopt_best_gain_ms: 50

reward:
  progress_per_m: 0.1         # main signal: metres gained along the reference line
  time_penalty: 0.01          # per step, so faster is always better
  pace_per_s: 10.0            # per second gained (or lost) on the pace baseline, point by point
  # The pace baseline is the median of the agent's last pace_baseline_laps finished
  # laps, measured point by point (a lap with a crash does not move it), so beating its own recent driving pays even when
  # the lap is not a best. Replay scores the pace term again against the current
  # baseline each batch, so old laps are judged by today's standard. Until
  # pace_baseline_min_laps laps are in, and with 0 laps, it is the reference lap.
  pace_baseline_laps: 20
  pace_baseline_min_laps: 5
  pb_bonus_per_s: 20.0        # at the finish, per second faster than the best lap so far
  pb_bonus_cap: 5.0
  crash_penalty: 1.0
  split_bonus_per_s: 1.0      # per second faster than the best split at a checkpoint
  split_bonus_cap: 2.0
  finish_bonus: 10.0

model:
  algorithm: sac_droq         # SAC actor + dropout/LayerNorm Q ensemble (DroQ)
  encoder_channels: [32, 64, 64, 64]
  hidden_dim: 256
  num_critics: 2
  critic_dropout: 0.01
  # bf16 autocast uses the 4050's tensor cores; fp32 master weights are kept.
  precision: bf16

train:
  batch_size: 256
  learning_rate: 3.0e-4
  # 0.995 at 20 Hz weighs about the next 10 s of driving (0.99 was 5 s), so the
  # critic sees how a corner exit pays off down the following straight.
  gamma: 0.995
  n_step: 3                   # rewards summed over this many steps before bootstrapping (Linesight uses 3)
  tau: 0.005
  updates_per_step: 4         # update-to-data ratio: learner updates per driving step
  warmup_steps: 1000          # steps of the untrained (near-random) policy before learning starts
  # Share of each batch drawn from guide laps: your demo laps plus the agent's own
  # fastest laps. Starts at demo_ratio (RLPD) and falls linearly to demo_ratio_end
  # over demo_anneal_steps driving steps, so slower demos stop anchoring the policy.
  # Setting it from the dashboard turns the schedule off for the rest of the run.
  demo_ratio: 0.5
  demo_ratio_end: 0.1
  demo_anneal_steps: 200000   # ~3 h of driving at 20 Hz
  best_laps_kept: 3           # agent's fastest finished laps kept as guide laps (0 = demos only)
  # SAC entropy target: how much randomness the policy keeps. Falls linearly from
  # target_entropy to target_entropy_end, so late training wastes fewer tenths on
  # noise. Setting it from the dashboard turns the schedule off for the rest of the run.
  target_entropy: -3.0
  target_entropy_end: -6.0
  entropy_anneal_steps: 500000
  # Every Nth attempt is a test lap without exploration noise; the best test lap's
  # driving weights are kept in checkpoints/best_test_lap.pt. 0 = no test laps.
  eval_every: 10
  checkpoint_every_min: 10

replay:
  # Stored in system RAM, not VRAM. ~4.2 KB per transition at 64x64 frames,
  # so 500k transitions is ~2.1 GB. `tmai doctor` suggests a size for your RAM.
  capacity: 500000
  snapshot_every_min: 30

gpu:
  # Hard cap on the share of VRAM PyTorch may allocate, leaving room for the game.
  max_vram_fraction: 0.5
  # Planned thermal governor, not used yet. NVML temperature thresholds (deg C):
  # above soft, halve updates_per_step; above hard, pause learning until it cools.
  temp_soft_c: 80
  temp_hard_c: 87

dashboard:
  host: 127.0.0.1             # never expose to the network
  port: 8080                  # web page: http://127.0.0.1:8080
  link_port: 8081             # trainer <-> dashboard messages (localhost UDP)
  tensorboard: true
