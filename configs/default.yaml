# Default run configuration, sized for an RTX 4050 Laptop GPU (6 GB VRAM)
# running Trackmania on the same GPU. Any key can be overridden with
# `tmai <command> --config my.yaml` or `--set section.key=value`.

run:
  name: default
  output_dir: runs            # checkpoints, replay snapshots, reports, logs
  seed: 0
  track: tmrl-test            # name used for runs/tracks/<track>/ (demos, reference line)

env:
  step_hz: 20                 # control frequency (TMRL uses 20 Hz too)
  frame_size: 64              # square grayscale frames fed to the CNN
  frame_stack: 4
  lookahead_points: 10        # reference-line points ahead of the car, in car frame
  lookahead_spacing_m: 10.0
  episode_timeout_s: 120      # hard cap per attempt; lap length should fit inside
  stuck_timeout_s: 3.0        # reset if speed stays below stuck_speed_kmh this long
  stuck_speed_kmh: 10.0
  telemetry_port: 9000        # Openplanet plugin -> Python (localhost only)
  # Gamepad button that restarts the run. B is the game's default respawn,
  # which restarts maps without checkpoints (like tmrl-test). For maps with
  # checkpoints, bind "Give up" to a free button in game and set it here.
  restart_button: B
  # Windows reads the virtual pad as a real controller, so menus like Alt+Tab,
  # Start and Game Bar would move with the agent's steering. shell: hold the
  # pad neutral while Alt/Win is held or such a menu is in front (the game may
  # stay in the background). game: only drive while the game is in front.
  # off: never hold back.
  input_guard: shell
  # window: capture the game window directly (works behind other windows).
  # screen: capture the screen area (game must be visible and on top).
  capture_backend: window
  # camera: true adds a small CNN over the stacked game frames. Off by default:
  # the agent drives from telemetry, the racing line and the lidar beams, which
  # is lighter on the GPU and learns faster. Changing it needs a fresh run.
  camera: false
  # Screen lidar (as in TMRL): beams cast across the game image from
  # lidar_origin (x, y as fractions of the picture, near the car) until they hit
  # a border darker than lidar_dark, which tells the agent how much room it has
  # ahead and to the sides. Only works on maps whose borders are darker than
  # the road; `tmai capture-test` draws the beams so you can check. 0 = off.
  # Changing it changes the inputs: re-record demos and start a fresh run.
  lidar_beams: 19
  lidar_width: 256            # beams are measured on a frame this many pixels wide
  lidar_origin: [0.5, 0.6]    # just above the car with the default chase camera
  lidar_dark: 90              # 0..255 grayscale; darker pixels count as border

track:
  reference_spacing_m: 1.0    # resolution of the reference line
  max_progress_jump_m: 30.0   # bigger jumps in one step are respawns/cuts: no credit
  wrong_way_m: 25.0           # end the attempt after falling this far behind the best progress
  off_track_m: 0.0            # end when this far from the line (0 = off; tracks vary)
  crash_speed_drop_kmh: 40.0  # speed lost in one step that counts as a crash
  # When the agent beats the reference lap by this much, its lap becomes the new
  # reference line (your demo line is kept as reference_demo.npz). 0 = never.
  adopt_best_gain_ms: 50

reward:
  progress_per_m: 0.1         # main signal: metres gained along the reference line
  time_penalty: 0.01          # per step, so faster is always better
  pace_per_s: 10.0            # per second gained (or lost) on the reference lap, point by point
  crash_penalty: 1.0
  split_bonus_per_s: 1.0      # per second faster than the best split at a checkpoint
  split_bonus_cap: 2.0
  finish_bonus: 10.0

model:
  algorithm: sac_droq         # SAC actor + dropout/LayerNorm Q ensemble (DroQ)
  encoder_channels: [32, 64, 64, 64]
  hidden_dim: 256
  num_critics: 2
  critic_dropout: 0.01
  # bf16 autocast uses the 4050's tensor cores; fp32 master weights are kept.
  precision: bf16

train:
  batch_size: 256
  learning_rate: 3.0e-4
  gamma: 0.99
  tau: 0.005
  updates_per_step: 4         # update-to-data ratio; auto-lowered when hot
  warmup_steps: 1000          # steps of the untrained (near-random) policy before learning starts
  demo_ratio: 0.5             # fraction of each batch from demonstrations (RLPD)
  checkpoint_every_min: 10

replay:
  # Stored in system RAM, not VRAM. ~4.2 KB per transition at 64x64 frames,
  # so 500k transitions is ~2.1 GB. `tmai doctor` suggests a size for your RAM.
  capacity: 500000
  snapshot_every_min: 30

gpu:
  # Hard cap on the share of VRAM PyTorch may allocate, leaving room for the game.
  max_vram_fraction: 0.5
  # NVML temperature thresholds (deg C): above soft, halve updates_per_step;
  # above hard, pause learning until the GPU cools below soft.
  temp_soft_c: 80
  temp_hard_c: 87

dashboard:
  host: 127.0.0.1             # never expose to the network
  port: 8080                  # web page: http://127.0.0.1:8080
  link_port: 8081             # trainer <-> dashboard messages (localhost UDP)
  tensorboard: true
