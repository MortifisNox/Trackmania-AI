name: Release

# Publishes a GitHub release whose notes come from docs/releases/<tag>.md.
# Either push a tag like v0.1.0, or run this workflow from the Actions tab
# with the tag name, which tags the current main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "Missing $notes: write the release notes there before releasing." >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" --target "$GITHUB_SHA"
