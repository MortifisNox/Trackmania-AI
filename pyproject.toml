[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmai"
version = "0.0.1"
description = "Continuous-learning driving agent for Trackmania (2020)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Installed on the Windows gaming machine only. PyTorch itself is installed
# separately from the CUDA wheel index (see docs/SETUP_WINDOWS.md).
game = [
    "vgamepad>=0.1.0",
    "pywin32>=306; sys_platform == 'win32'",
    "dxcam>=0.0.5; sys_platform == 'win32'",
    "nvidia-ml-py>=12.535",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tensorboard>=2.16",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tmai = "tmai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
